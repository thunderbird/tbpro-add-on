services:
  db:
    image: "postgres:15"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=send-suite
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # The bucket the backend storage round-trip suite runs against. Not part of the
  # dev stack -- `docker compose up` leaves it alone; start it explicitly with
  # `docker compose up -d minio` before `pnpm test` in packages/send/backend.
  minio:
    profiles: [ "test" ]
    # Pinned: an unpinned tag makes CI unreproducible, and a release that
    # changes `mc ready` would break the healthcheck below with no diff to blame.
    image: "minio/minio:RELEASE.2025-09-07T16-13-09Z"
    command: server /data --console-address ":9001"
    # No volume on purpose. It holds test objects the suite cleans up after
    # itself, so nothing here is worth surviving the container.
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./packages/send/backend/.docker-build
      dockerfile: Dockerfile
      args:
        BUILD_ENV: ${BUILD_ENV:-development}
    ports:
      - "8080:8080"
      - "5555:5555" # for browsing db with prisma studio
      - "9229:9229" # Debugger port
    environment:
      # Local dev has no separate migration Job, so the entrypoint is the only
      # thing that applies migrations. entry.sh gates this behind
      # RUN_MIGRATIONS_ON_BOOT (default OFF); opt in here. Must be a real env var
      # (not just in .env) because entry.sh reads it in the shell before node
      # loads dotenv. See scripts/entry.sh and tbpro-add-on#1069.
      - RUN_MIGRATIONS_ON_BOOT=true
      # Same reason: prisma's preflight (scripts/require-direct-url.sh) reads the
      # shell environment first. .env is only bind-mounted below, so give the
      # shell the value too. No connection pooler locally, so it matches
      # DATABASE_URL.
      - DIRECT_DATABASE_URL=postgres://postgres:postgres@db:5432/send-suite
    volumes:
      - ./packages/send/backend:/app
      - backend-node-modules:/app/node_modules
      - ./packages/send/backend/.env:/app/.env
    depends_on:
      db:
        condition: service_healthy

  reverse-proxy:
    build:
      context: ./packages/send/backend/tls-dev-proxy/
    ports:
      - "8088:12345"
    depends_on:
      - backend

  frontend:
    build:
      context: ./
      dockerfile: ./dockerfiles/Dockerfile-frontend
      args:
        BUILD_ENV: ${BUILD_ENV:-development}
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
volumes:
  postgres-data:
  backend-node-modules: # do not create on host
  frontend-node-modules: # do not create on host
