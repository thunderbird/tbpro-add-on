---
name: integration-tests

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "**"
      - "!main"
  # Fork branches are never pushed to this repo, so the push trigger above never
  # fires for them. The pull_request trigger is what gives fork PRs their checks.
  pull_request:
    branches:
      - main

permissions:
  packages: read
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    # Branches in this repo are already covered by the push trigger, so only let the
    # pull_request event do the work for forks. Every other job needs this one, so
    # skipping it here skips the whole duplicate run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    env:
      IS_CI_AUTOMATION: "yes"
    outputs:
      backend-changed: ${{ steps.check.outputs.backend-changed }}
      iac-changed: ${{ steps.check.outputs.iac-changed }}
      frontend-changed: ${{ steps.check.outputs.frontend-changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: check
        with:
          filters: |
            backend-changed:
              - 'packages/send/backend/**'
            iac-changed:
              - 'packages/send/pulumi/**'
              - '.github/workflows/validate.yml'
            frontend-changed:
              - 'packages/send/frontend/**'
  integration-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-changed == 'true' || needs.detect-changes.outputs.frontend-changed == 'true'
    runs-on: ubuntu-latest
    container:
        image: ghcr.io/${{ github.repository }}/cached-devcontainer:latest
    env:
      IS_CI_AUTOMATION: "yes"
    steps:
      - uses: actions/checkout@v4
      - name: Set up environments and install dependencies
        id: setup-and-install-dependencies
        run: |
          pnpm install --filter @thunderbird/tbpro-add-on && lerna run bootstrap
          pnpm i --filter "send-*"

          cd packages/send
          # Setup local environment (use public login)
          echo Y | pnpm setup:local

      - name: Run stack and test
        id: run-stack-and-test
        timeout-minutes: 10
        run: |
          lerna run build-image:backend --scope=send-suite
          pnpm run test:integration:ci
