---
name: validate

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "**"
      - "!main"
  # Fork branches are never pushed to this repo, so the push trigger above never
  # fires for them. The pull_request trigger is what gives fork PRs their checks.
  pull_request:
    branches:
      - main

permissions:
  packages: read
  contents: read

jobs:
  # This job detects which parts of the repo have been changed, setting future jobs up for conditional behavior.
  detect-changes:
    runs-on: ubuntu-latest
    # Branches in this repo are already covered by the push trigger, so only let the
    # pull_request event do the work for forks. Every other job needs this one, so
    # skipping it here skips the whole duplicate run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    env:
      IS_CI_AUTOMATION: "yes"
    outputs:
      backend-changed: ${{ steps.check.outputs.backend-changed }}
      iac-changed: ${{ steps.check.outputs.iac-changed }}
      frontend-changed: ${{ steps.check.outputs.frontend-changed }}
      addon-changed: ${{ steps.check.outputs.addon-changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: check
        with:
          filters: |
            backend-changed:
              - 'packages/send/backend/**'
              # The backend suite needs the compose MinIO service and the steps
              # below that start it. Without these, bumping the pin or moving
              # the port silently skips the gate that would catch it.
              - 'compose.yml'
              - '.github/workflows/validate.yml'
            iac-changed:
              - 'packages/send/pulumi/**'
              - '.github/workflows/validate.yml'
            frontend-changed:
              - 'packages/send/frontend/**'
            addon-changed:
              - 'packages/addon/**'

  # When the backend code changes, run these steps
  backend-tests:
    needs: detect-changes
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/cached-devcontainer:latest
    env:
      IS_CI_AUTOMATION: "yes"
    if: needs.detect-changes.outputs.backend-changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        id: install-dependencies
        run: |
          pnpm install --filter @thunderbird/tbpro-add-on && lerna run bootstrap
          cd packages/send
          pnpm install --filter send-backend

      # Must precede Start MinIO: compose.yml gives `minio-init` an `env_file`
      # pointing at this path, so the project cannot be fully resolved until it
      # exists. Compose is lazy enough today that starting `minio` on its own
      # works without it, but a `docker compose config` in the next step would
      # not, and the error would name neither MinIO nor this file.
      - name: Write backend .env
        run: cp packages/send/backend/.env.sample packages/send/backend/.env

      # The storage suite round-trips a file through a real bucket. This job runs
      # in a container with the host's docker socket mounted, so compose's
      # published port lands on the host -- and it is bound to the host's
      # loopback, which is not this container's. Join the compose network and
      # address the service by name instead. Same compose service developers
      # run, so the two cannot drift.
      - name: Start MinIO
        id: start-minio
        run: |
          docker compose up -d --wait minio
          minio_id=$(docker compose ps -q minio)
          if [ -z "$minio_id" ]; then
            echo "::error::minio container did not start"
            exit 1
          fi
          # `println` per network, then take the first: the container is on one
          # network, but a bare range would concatenate names if that changed.
          network=$(docker inspect \
            -f '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' \
            "$minio_id" | head -1)
          if [ -z "$network" ]; then
            echo "::error::could not resolve the minio compose network"
            exit 1
          fi
          echo "MINIO_NETWORK=$network" >> "$GITHUB_ENV"
          docker network connect "$network" "$(cat /etc/hostname)"

      - name: Backend tests
        id: backend-tests
        run: |
          cd packages/send/backend

          # .env.sample points at localhost, which is this container, not the
          # bucket. On the compose network the service answers to its own name.
          sed -i "s|^TEST_MINIO_ENDPOINT=.*$|TEST_MINIO_ENDPOINT=http://minio:9000|" .env

          pnpm prisma generate
          pnpm ci:validate

      - name: Stop MinIO
        if: always() && steps.start-minio.outcome == 'success'
        run: |
          docker network disconnect "$MINIO_NETWORK" "$(cat /etc/hostname)" || true
          docker compose rm -sf minio

  # When Pulumi code or configs change, run these steps
  iac-lint:
    needs: detect-changes
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/cached-devcontainer:latest
    env:
      IS_CI_AUTOMATION: "yes"
    if: needs.detect-changes.outputs.iac-changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Ruff checks for Send Pulumi code
        run: |
          ruff check ./packages/send/pulumi
          ruff format --check ./packages/send/pulumi

  # When the frontend code changes, run these steps
  frontend-tests-and-lint:
    needs: detect-changes
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/cached-devcontainer:latest
    env:
      IS_CI_AUTOMATION: "yes"
    if: needs.detect-changes.outputs.frontend-changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        id: install-dependencies
        run: |
          pnpm install --filter @thunderbird/tbpro-add-on && lerna run bootstrap
          pnpm install --filter send-frontend
          pnpm install --filter send-backend
          lerna run db:generate --scope=send-backend

      - name: Create .env file so tests will work
        run: |
          cd packages/send/frontend
          cat << EOF > .env
          VUE_BASE_URL=https://send-stage.tb.pro
          VITE_SEND_SERVER_URL=https://send-backend-stage.tb.pro
          VITE_SEND_CLIENT_URL=https://send-stage.tb.pro
          VITE_SENTRY_AUTH_TOKEN=${{ secrets.VITE_SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          VITE_POSTHOG_PROJECT_KEY=${{ secrets.VITE_POSTHOG_PROJECT_KEY }}
          VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
          EOF

      - name: Frontend tests and lint
        id: frontend-tests-and-lint
        run: |
          lerna run ci:validate --scope=send-frontend

  # When the addon package code changes, run these steps
  addon-changes:
    needs: detect-changes
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/cached-devcontainer:latest
    env:
      IS_CI_AUTOMATION: "yes"
    if: needs.detect-changes.outputs.addon-changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Create .env file so tests will work
        run: |
          cd packages/addon
          cat << EOF > .env
          VUE_BASE_URL=https://send-stage.tb.pro
          VITE_SEND_SERVER_URL=https://send-backend-stage.tb.pro
          VITE_SEND_CLIENT_URL=https://send-stage.tb.pro
          VITE_SENTRY_AUTH_TOKEN=${{ secrets.VITE_SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          VITE_POSTHOG_PROJECT_KEY=${{ secrets.VITE_POSTHOG_PROJECT_KEY }}
          VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
          EOF

      - name: Install dependencies
        id: install-dependencies
        run: |
          pnpm install --filter @thunderbird/tbpro-add-on && lerna run bootstrap
          # install packages that addon depends on
          pnpm install --filter send-frontend
          pnpm install --filter addon

      - name: Shared package tests and lint
        id: shared-tests
        run: |
          lerna run ci:validate --scope=addon
          lerna run test --scope=addon
