---
name: deploy-stage-and-create-release

concurrency:
  group: deploy-stage
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      force_backend:
        description: Force backend build and deploy for this manual run
        required: false
        type: boolean
        default: false
      force_frontend:
        description: Force frontend build, deploy, and CDN invalidation for this manual run
        required: false
        type: boolean
        default: false
      force_addon:
        description: Force the system add-on build and artifact upload for this manual run
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

# Read-only by default; the jobs that assume the AWS role add id-token: write.
permissions:
  packages: read
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    env:
      IS_CI_AUTOMATION: "yes"
    outputs:
      backend-changed: ${{ steps.check.outputs.backend-changed == 'true' || github.event.inputs.force_backend == 'true' }}
      iac-changed: ${{ steps.check.outputs.iac-changed }}
      frontend-changed: ${{ steps.check.outputs.frontend-changed == 'true' || github.event.inputs.force_frontend == 'true' }}
      addon-changed: ${{ steps.check.outputs.addon-changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: check
        with:
          filters: |
            backend-changed:
              - 'packages/send/backend/**'
              # - '.github/workflows/merge.yml'
            iac-changed:
              - 'packages/send/pulumi/**'
              - '.github/workflows/validate.yml'
            frontend-changed:
              - 'packages/send/frontend/**'
              # - '.github/workflows/merge.yml'
            addon-changed:
              - 'packages/addon/**'

  backend-build-stage:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # OIDC token for aws-actions/configure-aws-credentials.
      id-token: write
    outputs:
      backend-image: ${{ steps.build-backend.outputs.backend-image }}
    container:
      image: ghcr.io/${{ github.repository }}/cached-devcontainer:latest
    env:
      IS_CI_AUTOMATION: "yes"
    environment:
      name: send-stage
    steps:
      - name: test echo
        run: |
          echo "Building backend with changes: ${{ needs.detect-changes.outputs.backend-changed }} and iac changes: ${{ needs.detect-changes.outputs.iac-changed }}"
          date

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm and build package
        # if: needs.detect-changes.outputs.backend-changed == 'true'
        id: install-pnpm-build
        run: |
          pnpm install --filter @thunderbird/tbpro-add-on && lerna run bootstrap
          pnpm install --filter send-backend
          lerna run build-image:backend --scope=send-suite

      - name: Configure AWS credentials
        # if: needs.detect-changes.outputs.backend-changed == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        # if: needs.detect-changes.outputs.backend-changed == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          mask-password: "true"

      - name: Build, tag, and push backend image to Amazon ECR
        # if: needs.detect-changes.outputs.backend-changed == 'true'
        id: build-backend
        env:
          ECR_TAG: "${{ steps.login-ecr.outputs.registry }}/${{ vars.PROJECT }}:${{ github.sha }}"
        run: |
          # Build a docker container and push it to ECR so that it can be deployed to ECS.
          docker build -t "$ECR_TAG" ./packages/send/backend/.docker-build
          docker push "$ECR_TAG"
          echo "backend-image=$ECR_TAG" >> "$GITHUB_OUTPUT"
          echo -n "$ECR_TAG" > ecr_tag.txt

      - name: Archive the ECR tag
        # if: needs.detect-changes.outputs.backend-changed == 'true'
        id: tag-archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ecr_tag
          path: ecr_tag.txt

  backend-deploy-stage-aws:
    needs: ["backend-build-stage", "detect-changes"]
    if: needs.detect-changes.outputs.backend-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # OIDC token for aws-actions/configure-aws-credentials.
      id-token: write
    container:
      image: ghcr.io/${{ github.repository }}/cached-devcontainer:latest
    env:
      IS_CI_AUTOMATION: "yes"
    environment:
      name: send-stage
    outputs:
      ecs_deployed: ${{ steps.wait-deployment.outputs.ecs_deployed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "Test echo"
        run: |
          echo "Deploying backend with image ${{ needs.backend-build-stage.outputs.backend-image }}"
          date

      - name: Configure AWS credentials
        # if: needs.detect-changes.outputs.backend-changed == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Deploy new image to stage
        # if: needs.detect-changes.outputs.backend-changed == 'true'
        env:
          ECR_TAG: "${{ needs.backend-build-stage.outputs.backend-image }}"
          PULUMI_ACCESS_TOKEN: "${{ secrets.PULUMI_ACCESS_TOKEN }}"
        run: |
          # Update the PATH to include the right version of Pulumi; this is non-trivial or impossible
          # to do with the GHA workflow "env" settings above.
          export PATH="/home/runner/.pulumi/bin:$PATH"

          cd packages/send/pulumi

          # Create a YAML config stump containing only the nested tree leading to the image tag update
          cat << EOF > newimage.yaml
          resources:
            tb:fargate:FargateClusterWithLogging:
              backend:
                task_definition:
                  container_definitions:
                    backend:
                      image: "$ECR_TAG"
          EOF

          # Use yq to merge the stump into the main config
          yq -i '. *= load("newimage.yaml")' config.stage.yaml

          # Set up the Pulumi environment and update the service
          export PULUMI_CONFIG_PASSPHRASE="${{ secrets.PULUMI_PASSPHRASE_STAGE }}"
          pulumi login
          pulumi stack select stage
          pulumi up -y --diff --target \
            "urn:pulumi:stage::send-suite::tb:fargate:FargateClusterWithLogging\$aws:ecs/taskDefinition:TaskDefinition::send-suite-stage-fargate-taskdef" \
            --target-dependents

      - name: Wait for ecs to update the service
        id: wait-deployment
        # if: needs.detect-changes.outputs.backend-changed == 'true'
        run: |
          aws ecs wait services-stable --region eu-central-1 --cluster send-suite-stage-fargate --services send-suite-stage-fargate
          echo "ecs_deployed=true" >> "$GITHUB_OUTPUT"

  frontend-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/cached-devcontainer:latest
    env:
      IS_CI_AUTOMATION: "yes"
    environment:
      name: send-stage
    strategy:
      matrix:
        env: ["stage", "prod"]
        include:
          - env: "stage"
            base_url: "https://send-stage.tb.pro"
            send_server_url: "https://send-backend-stage.tb.pro"
            send_client_url: "https://send-stage.tb.pro"
            oidc_root_url: "https://auth.stage-thundermail.com/realms/tbpro/"
            accounts_url: "https://accounts.stage-thundermail.com"
          - env: "prod"
            base_url: "https://send.tb.pro"
            send_server_url: "https://send-backend.tb.pro"
            send_client_url: "https://send.tb.pro"
    steps:
      - name: test echo
        run: |
          echo "Building frontend for environment ${{ matrix.env }} with base URL ${{ matrix.base_url }}"
          date

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm and build package
        # if: needs.detect-changes.outputs.frontend-changed == 'true'
        id: install-pnpm-build
        run: |
          pnpm install --filter @thunderbird/tbpro-add-on && lerna run bootstrap
          pnpm install --filter send-frontend
          lerna run build --scope=send-suite

      # Front end build env configuration
      - name: Create .env file from secrets
        # if: needs.detect-changes.outputs.frontend-changed == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ matrix.env == 'stage' && secrets.VITE_SENTRY_AUTH_TOKEN_STAGE || secrets.VITE_SENTRY_AUTH_TOKEN_PROD }}
          SENTRY_DSN: ${{ matrix.env == 'stage' && vars.VITE_SENTRY_DSN_STAGE || vars.VITE_SENTRY_DSN_PROD }}
          POSTHOG_KEY: ${{ matrix.env == 'stage' && secrets.VITE_POSTHOG_PROJECT_KEY_STAGE || secrets.VITE_POSTHOG_PROJECT_KEY_PROD }}
          POSTHOG_HOST: ${{ matrix.env == 'stage' && vars.VITE_POSTHOG_HOST_STAGE || vars.VITE_POSTHOG_HOST_PROD }}
          OIDC_CLIENT_ID: ${{ matrix.env == 'stage' && secrets.VITE_OIDC_CLIENT_ID_STAGE || secrets.VITE_OIDC_CLIENT_ID_PROD }}
          OIDC_ROOT_URL: ${{ matrix.env == 'stage' && matrix.oidc_root_url || secrets.VITE_OIDC_ROOT_URL_PROD }}
          BASE_URL: ${{ matrix.base_url }}
          SEND_SERVER_URL: ${{ matrix.send_server_url }}
          SEND_CLIENT_URL: ${{ matrix.send_client_url }}
          ACCOUNTS_URL: ${{ matrix.accounts_url }}
        run: |
          echo "Environment: ${{ matrix.env }}"
          cd packages/send/frontend
          cat <<EOF > .env
          VUE_BASE_URL=${BASE_URL}
          VITE_SEND_SERVER_URL=${SEND_SERVER_URL}
          VITE_SEND_CLIENT_URL=${SEND_CLIENT_URL}
          VITE_SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
          VITE_SENTRY_DSN=${SENTRY_DSN}
          VITE_POSTHOG_PROJECT_KEY=${POSTHOG_KEY}
          VITE_POSTHOG_HOST=${POSTHOG_HOST}
          VITE_OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
          VITE_OIDC_ROOT_URL=${OIDC_ROOT_URL}
          VITE_ACCOUNTS_URL=${ACCOUNTS_URL}
          VITE_DASHBOARD_URL=${ACCOUNTS_URL:+${ACCOUNTS_URL}/send/dashboard}
          VITE_CONTACT_FORM_URL=${ACCOUNTS_URL:+${ACCOUNTS_URL}/contact}
          VITE_THUNDERMAIL_URL=${ACCOUNTS_URL:+${ACCOUNTS_URL}/mail}
          EOF

      - name: Build frontend assets
        if: needs.detect-changes.outputs.frontend-changed == 'true'
        id: frontend-build
        env:
          BASE_URL: ${{ matrix.base_url }}
          IS_CI_AUTOMATION: yes
        run: |
          echo "Building for environment: ${{ matrix.env }}"
          set -x
          # Initial setup of dependencies
          pnpm install --filter @thunderbird/tbpro-add-on && lerna run bootstrap
          pnpm install --filter send-frontend
          cd packages/send/frontend

          # Web bundle only -- `pnpm build` also builds the legacy standalone
          # XPI, which CI must not publish (scripts/build.sh, issue #1238).
          pnpm build:web
          mv dist-web ../dist-web-${{ matrix.env }}

      - name: Archive the ${{ matrix.env }} frontend build
        if: needs.detect-changes.outputs.frontend-changed == 'true'
        id: frontend-archive-stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-web-${{ matrix.env }}
          path: packages/send/dist-web-${{ matrix.env }}
          compression-level: 0

  frontend-deploy-stage-aws:
    needs: ["frontend-build", "detect-changes"]
    if: needs.detect-changes.outputs.frontend-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # OIDC token for aws-actions/configure-aws-credentials.
      id-token: write
    container:
      image: ghcr.io/${{ github.repository }}/cached-devcontainer:latest
    environment:
      name: send-stage
    outputs:
      s3_deployed: ${{ steps.frontend-deploy.outputs.s3_deployed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test echo
        run: |
          echo "Deploying frontend to AWS for environment stage"
          date

      - name: Download frontend-archive-stage artifact
        if: needs.detect-changes.outputs.frontend-changed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-web-stage
          path: frontend-source

      - name: Configure AWS credentials
        if: needs.detect-changes.outputs.frontend-changed == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Deploy to stage
        if: needs.detect-changes.outputs.frontend-changed == 'true'
        id: frontend-deploy
        run: |
          cd frontend-source
          aws s3 cp . s3://tb-send-suite-stage-frontend/ --recursive
          echo "s3_deployed=true" >> "$GITHUB_OUTPUT"

  frontend-invalidate-stage-cdn:
    needs: [detect-changes, frontend-deploy-stage-aws, backend-deploy-stage-aws]
    if: ${{ always() && needs.detect-changes.outputs.frontend-changed == 'true' && needs.frontend-deploy-stage-aws.result == 'success' && (needs.detect-changes.outputs.backend-changed != 'true' || needs.backend-deploy-stage-aws.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # OIDC token for aws-actions/configure-aws-credentials.
      id-token: write
    environment:
      name: send-stage
    steps:
      - name: Test echo
        run: |
          echo "Invalidating CDN for stage environment"
          date

      - name: Configure AWS credentials
        # if: needs.detect-changes.outputs.frontend-changed == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Invalidate CDN, stage only
        if: needs.frontend-deploy-stage-aws.outputs.s3_deployed == 'true'
        run: |
          echo "Invalidating CDN for environment: stage"
          aws cloudfront create-invalidation --distribution-id ${{ vars.STAGE_CF_DISTRO_ID }} --paths "/*"

  addon-changes:
    needs: detect-changes
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/cached-devcontainer:latest
    ### Prod only, and no build matrix. The one add-on we ship is the system
    ### add-on, which is repacked from this prod build. There used to be a stage
    ### leg too, but it existed solely to build the standalone stage XPI and sign
    ### it onto ATN, and neither of those happens any more (issue #1238).
    env:
      IS_CI_AUTOMATION: yes
      ENV: prod
      BASE_URL: https://send.tb.pro
      SEND_SERVER_URL: https://send-backend.tb.pro
      SEND_CLIENT_URL: https://send.tb.pro
    if: needs.detect-changes.outputs.addon-changed == 'true' || needs.detect-changes.outputs.frontend-changed == 'true' || github.event.inputs.force_addon == 'true'
    environment:
      name: send-stage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: (send frontend) Create .env file from secrets
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.VITE_SENTRY_AUTH_TOKEN_PROD }}
          SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN_PROD }}
          POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_PROJECT_KEY_PROD }}
          POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST_PROD }}
          OIDC_CLIENT_ID: ${{ secrets.VITE_OIDC_CLIENT_ID_PROD }}
          OIDC_ROOT_URL: ${{ secrets.VITE_OIDC_ROOT_URL_PROD }}
        run: |
          echo "Environment: $ENV"
          cd packages/send/frontend
          cat << EOF > .env
          VUE_BASE_URL=${BASE_URL}
          VITE_SEND_SERVER_URL=${SEND_SERVER_URL}
          VITE_SEND_CLIENT_URL=${SEND_CLIENT_URL}
          VITE_SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
          VITE_SENTRY_DSN=${SENTRY_DSN}
          VITE_POSTHOG_PROJECT_KEY=${POSTHOG_KEY}
          VITE_POSTHOG_HOST=${POSTHOG_HOST}
          VITE_OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
          VITE_OIDC_ROOT_URL=${OIDC_ROOT_URL}                    
          EOF

      - name: (addon) Create .env file from secrets
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.VITE_SENTRY_AUTH_TOKEN_PROD }}
          SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN_PROD }}
          POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_PROJECT_KEY_PROD }}
          POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST_PROD }}
          OIDC_CLIENT_ID: ${{ secrets.VITE_OIDC_CLIENT_ID_PROD }}
          OIDC_ROOT_URL: ${{ secrets.VITE_OIDC_ROOT_URL_PROD }}
          DEPRECATION_VERSION: "153.0.0"
        run: |
          echo "Environment: $ENV"
          cd packages/addon
          cat << EOF > .env
          VUE_BASE_URL=${BASE_URL}
          VITE_SEND_SERVER_URL=${SEND_SERVER_URL}
          VITE_SEND_CLIENT_URL=${SEND_CLIENT_URL}
          VITE_SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
          VITE_SENTRY_DSN=${SENTRY_DSN}
          VITE_POSTHOG_PROJECT_KEY=${POSTHOG_KEY}
          VITE_POSTHOG_HOST=${POSTHOG_HOST}
          VITE_OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
          VITE_OIDC_ROOT_URL=${OIDC_ROOT_URL}
          VITE_DEPRECATION_VERSION=${DEPRECATION_VERSION}
          EOF

      - name: Build the frontend's static assets
        id: addon-frontend-build
        run: |
          # install packages that addon depends on
          pnpm install --filter addon
          pnpm install --filter send-frontend

          lerna run build --scope=addon

          cd packages/addon/

          # Find build addon xpi file
          XPI="$(find tbpro-addon-*.xpi)"

          # create now file name for env
          RENAMED_XPI="tbpro-addon-${ENV}-$(basename "$XPI" | cut -d "-" -f3-)"

          # rename the file by moving
          mv -v "${XPI}" "${RENAMED_XPI}"

          # export outputs for use in next steps
          echo "xpi_filename=$RENAMED_XPI" >> "$GITHUB_OUTPUT"
          echo "xpi_file_path=packages/addon/$RENAMED_XPI" >> "$GITHUB_OUTPUT"

      - name: Build system-add-on XPI
        ### The tbpro-addon-prod-*.xpi built above is deliberately not archived:
        ### it is the standalone add-on, which is not shipped for any purpose any
        ### more. It survives only as the input to this repack.
        id: system-addon-build
        run: |
          PROD_XPI="${{ steps.addon-frontend-build.outputs.xpi_filename }}"
          VERSION_SUFFIX=$(echo "$PROD_XPI" | cut -d'-' -f4-)
          SYSTEM_XPI="tbpro-system-add-on-prod-${VERSION_SUFFIX}"

          # Extract, swap the ID in manifest.json, repack.
          # The system add-on id lives in packages/addon/src/addonIds.ts so it is
          # not hard-coded here; set-system-id.ts rewrites prod -> system id.
          mkdir -p /tmp/system-addon-unpack
          unzip "packages/addon/$PROD_XPI" -d /tmp/system-addon-unpack
          bun run packages/addon/scripts/set-system-id.ts /tmp/system-addon-unpack/manifest.json

          # Strip sourcemaps from the shipped system add-on: delete standalone
          # *.map files and remove the sourceMappingURL comments (the background
          # bundle inlines its map as a data: URI, so it has no separate file).
          # The maps were already uploaded to Sentry during the addon build
          # above, so crash symbolication is unaffected — we only stop shipping
          # them into comm-central.
          find /tmp/system-addon-unpack -type f -name '*.map' -delete
          find /tmp/system-addon-unpack -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.css' \) \
            -exec perl -ni -e 'print unless m{^\s*(//|/\*)# sourceMappingURL=}' {} +

          cd /tmp/system-addon-unpack
          zip -r "$GITHUB_WORKSPACE/packages/addon/$SYSTEM_XPI" .

          echo "system_xpi_filename=$SYSTEM_XPI" >> "$GITHUB_OUTPUT"
          echo "system_xpi_file_path=packages/addon/$SYSTEM_XPI" >> "$GITHUB_OUTPUT"

      - name: Archive the system-add-on XPI
        id: xpi-archive-system-addon
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: system-add-on-prod
          path: ${{ steps.system-addon-build.outputs.system_xpi_file_path }}
          compression-level: 0 # <-- don't zip!
