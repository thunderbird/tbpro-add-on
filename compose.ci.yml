services:
  db:
    image: "postgres:15"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=send-suite
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      # Postgres is ready in a second or two, but `depends_on: service_healthy`
      # cannot release the backend until a probe actually succeeds -- so a 10s
      # interval spent ~10s of every stack boot waiting to ask. Probe often, keep
      # roughly the same total patience via retries.
      interval: 2s
      timeout: 5s
      retries: 25

  backend:
    build:
      context: ./packages/send/backend/.docker-build
      dockerfile: Dockerfile
      args:
        BUILD_ENV: ${BUILD_ENV:-development}
    ports:
      - "8080:8080"
      - "5555:5555" # for browsing db with prisma studio
      - "9229:9229" # Debugger port
    env_file:
      - ./packages/send/backend/.env
    depends_on:
      db:
        condition: service_healthy

  reverse-proxy:
    build:
      context: ./packages/send/backend/tls-dev-proxy/
    ports:
      - "8088:12345"
    depends_on:
      - backend

  frontend:
    build:
      context: ./
      dockerfile: ./dockerfiles/Dockerfile-frontend
      args:
        BUILD_ENV: ${BUILD_ENV:-development}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
