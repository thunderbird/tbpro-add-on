---
loader: taskgraph.loader.transform:loader

transforms:
    - xpi_taskgraph.build:transforms
    - xpi_taskgraph.cached:transforms
    - taskgraph.transforms.cached_tasks:transforms
    - taskgraph.transforms.run:transforms
    - taskgraph.transforms.task:transforms

task-defaults:
    description: Build XPI from source code.
    worker-type: b-linux
    worker:
        max-run-time: 7200
        docker-image:
            indexed: xpi.cache.level-3.docker-images.v2.node-20.latest
        chain-of-trust: true
        volumes:
            - /builds/worker/checkouts
            - /builds/worker/.cache
        env:
            XPI_BUILD_COMMANDS: >-
                [["pnpm","install","--frozen-lockfile"],["pnpm","exec","lerna","run","build","--scope","thundermail"]]
            ADDON_VARIANT: system
            BASE_URL: https://send.tb.pro
            XPI_OUTPUT_NAME: thundermail.xpi
            XPI_ARTIFACTS: packages/addon/thundermail.xpi
            XPI_PRESERVE_VERSION: "1"
            XPI_VERSION_FILE: packages/addon/package.json
    run:
        checkout:
            xpi: {}
        use-caches: false

tasks:
    ci:
        attributes:
            code-review: true
        run:
            using: run-task
            cwd: '{checkout}'
            cache-dotcache: false
            command: >-
                python3 /usr/local/bin/build.py
