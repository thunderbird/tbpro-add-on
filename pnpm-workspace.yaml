packages:
  - packages/send
  - packages/send/backend
  - packages/send/frontend
  - packages/send/e2e
  - packages/addon
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@sentry/cli': true
  '@sentry/profiling-node': true
  aws-sdk: true
  core-js: true
  esbuild: true
  msw: true
  nx: true
  prisma: true
  protobufjs: true
  vue-demi: true
injectWorkspacePackages: true
minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - '@sentry/cli'
  - '@sentry/profiling-node'
  - aws-sdk
  - core-js
  - esbuild
  - msw
  - nx
  - prisma
  - protobufjs
  - vue-demi
overrides:
  '@opentelemetry/core@<2.8.0': '>=2.8.0'
  axios@>=1.0.0 <1.20.0: ^1.20.0
  basic-ftp@<=6.2.0: ^6.2.1
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  browserstack-node-sdk>aws-sdk: 2.1693.0
  fflate@>=0.4.5 <0.4.9: '>=0.4.9'
  nx@>=23.0.0 <24.0.0: 23.2.1
  postcss-selector-parser@>=6.1.0 <6.1.3: '>=6.1.3'
  qs@>=2.2.5 <6.16.0: '>=6.16.0'
  smol-toml@<=1.8.0: ^1.9.1
  tsx: 4.23.1
  uuid@<11.1.1: '>=11.1.1'
  vue@3.5.41: ^3.5.43
