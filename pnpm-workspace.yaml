packages:
  - packages/send
  - packages/send/backend
  - packages/send/frontend
  - packages/send/e2e
  - packages/addon

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@sentry/cli': true
  '@sentry/profiling-node': true
  aws-sdk: true
  core-js: true
  esbuild: true
  msw: true
  nx: true
  prisma: true
  protobufjs: true
  vue-demi: true

injectWorkspacePackages: true

minimumReleaseAgeExclude:
  - aws-sdk@2.1693.0
  - axios@1.18.0
  - brace-expansion@1.1.16 || 1.1.17 || 1.1.18 || 2.1.2 || 2.1.3 || 2.1.4 || 5.0.7 || 5.0.8 || 5.0.9
  - js-yaml@4.3.0
  - tar@7.5.17 || 7.5.18 || 7.5.19 || 7.5.21
  - protobufjs@7.6.5
  - body-parser@1.20.6
  - dompurify@3.4.12
  - fast-uri@3.1.3 || 3.1.4 || 3.1.5
  - postcss@8.5.18 || 8.5.23
  - nx@22.7.2
  - undici@6.28.0
  - ip-address@10.2.1 || 10.2.2 || 10.3.1

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - '@sentry/cli'
  - '@sentry/profiling-node'
  - aws-sdk
  - core-js
  - esbuild
  - msw
  - nx
  - prisma
  - protobufjs
  - vue-demi

overrides:
  '@opentelemetry/core@<2.8.0': '>=2.8.0'
  '@sigstore/verify@<=3.1.0': '>=3.1.1'
  browserstack-node-sdk>aws-sdk: 2.1693.0
  axios@>=1.0.0 <1.18.0: '>=1.18.0'
  body-parser@<1.20.6: ^1.20.6
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  brace-expansion@>=3.0.0 <5.0.9: ^5.0.9
  dompurify@<=3.4.11: ^3.4.12
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1'
  fast-uri@>=3.0.0 <3.1.5: '>=3.1.5'
  follow-redirects@<=1.15.11: '>=1.16.0'
  form-data@>=4.0.0 <4.0.6: '>=4.0.6'
  ip-address@<=10.3.0: '>=10.3.1'
