packages:
  - packages/send
  - packages/send/backend
  - packages/send/frontend
  - packages/send/e2e
  - packages/addon

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@sentry/cli': true
  '@sentry/profiling-node': true
  aws-sdk: true
  core-js: true
  esbuild: true
  msw: true
  nx: true
  prisma: true
  protobufjs: true
  vue-demi: true

injectWorkspacePackages: true

minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - '@sentry/cli'
  - '@sentry/profiling-node'
  - aws-sdk
  - core-js
  - esbuild
  - msw
  - nx
  - prisma
  - protobufjs
  - vue-demi

overrides:
  # Security floors that remain unavoidable: the vulnerable version is pulled by
  # a transitive dependency with no upgradable direct parent.
  # @opentelemetry/*: pulled by @sentry/node@8. Clearing them naturally needs the
  #   @sentry/* v8 -> v10 major bump (tracked in #1305).
  '@opentelemetry/core@<2.8.0': '>=2.8.0'
  '@opentelemetry/instrumentation-knex@<0.65.0': ^0.65.0
  '@opentelemetry/instrumentation-mongoose@<0.67.0': ^0.67.0
  '@opentelemetry/instrumentation-mysql2@<0.67.0': ^0.67.0
  '@opentelemetry/instrumentation-mysql@<0.67.0': ^0.67.0
  '@opentelemetry/instrumentation-pg@<0.73.0': ^0.73.0
  '@opentelemetry/instrumentation-tedious@<0.40.0': ^0.40.0
  # undici@7: pinned exactly by nx@23.3.0 (via lerna); nx 23.3.1 ships the fix.
  undici@>=7.0.0 <7.30.1: ^7.30.1
  # qs: body-parser@1.20.6 (via express@4) ships qs 6.15.x; qs 6.16.1 fixes a
  #   second advisory. body-parser 1.20.9 clears both once it is older than the
  #   7-day release-age window.
  qs@>=6.14.2 <=6.16.0: '>=6.16.1'
  # vue: @thunderbirdops/services-ui pins vue@3.5.41 exactly; keep a single Vue
  #   copy that matches the app's vue and carries the @vue/server-renderer fix.
  '@thunderbirdops/services-ui>vue': ^3.5.44
  # basic-ftp: get-uri (via browserstack-node-sdk>pac-proxy-agent, e2e) still
  #   declares ^5; the fix is in the 6.x line.
  basic-ftp@<=6.2.0: ^6.2.1
